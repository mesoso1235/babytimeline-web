<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>パパの育児タイムライン</title>
  <meta name="description" content="新米パパのための育児タイムライン。出産予定日から1歳の誕生日まで伴走します。" />
  <meta name="theme-color" content="#0f0c29" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========== 画面0: セットアップ ========== -->
  <div id="screen-setup" class="screen active">
    <div class="setup-bg">
      <div class="setup-blob blob1"></div>
      <div class="setup-blob blob2"></div>
    </div>
    <div class="setup-card glass">
      <div class="setup-icon">👶</div>
      <h1 class="setup-title">パパの<br>育児タイムライン</h1>
      <p class="setup-sub">おめでとうございます！<br>出産予定日 または お子さんの誕生日を入力してください</p>

      <div class="tab-row" role="tablist">
        <button class="tab-btn active" id="tab-future" role="tab" aria-selected="true" onclick="setMode('future')">🗓 出産予定日</button>
        <button class="tab-btn" id="tab-past" role="tab" aria-selected="false" onclick="setMode('past')">🎂 誕生日</button>
      </div>

      <div class="date-picker-wrapper glass-inner">
        <label class="date-label" id="date-label">出産予定日を選んでください</label>
        <input type="date" id="date-input" class="date-input" />
      </div>

      <button class="start-btn" id="start-btn" onclick="saveAndStart()">
        <span>アプリをはじめる</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- ========== 画面1: ホーム ========== -->
  <div id="screen-home" class="screen">
    <div class="home-header">
      <div class="home-header-inner">
        <span class="app-name">👶 パパの育児タイムライン</span>
        <button class="reset-btn" onclick="resetApp()" title="設定リセット">⚙️</button>
      </div>
    </div>

    <!-- ブロック1: 今の状態 -->
    <div class="current-status glass">
      <div class="status-badge" id="status-badge">計算中…</div>
      <div class="status-main" id="status-main">--</div>
      <div class="status-sub" id="status-sub">読み込み中</div>
    </div>

    <!-- ブロック2: 今週のクイックビュー -->
    <div class="section-label">📍 今の時期のポイント</div>
    <div class="quick-card glass" id="quick-card" onclick="openCurrentDetail()">
      <div class="quick-period" id="quick-period">--</div>
      <div class="quick-row">
        <div class="quick-item">
          <span class="quick-icon">🤰</span>
          <div>
            <div class="quick-item-label">ママの状態</div>
            <div class="quick-item-text" id="quick-mama">--</div>
          </div>
        </div>
        <div class="quick-item">
          <span class="quick-icon">🏃</span>
          <div>
            <div class="quick-item-label">パパのミッション</div>
            <div class="quick-item-text" id="quick-mission">--</div>
          </div>
        </div>
      </div>
      <div class="quick-more">詳しく見る →</div>
    </div>

    <!-- ブロック3: 全タイムライン -->
    <div class="section-label">📅 全タイムライン</div>
    <div class="timeline-list" id="timeline-list">
      <!-- JS で生成 -->
    </div>

    <div class="footer-space"></div>
  </div>

  <!-- ========== 画面2: 詳細 ========== -->
  <div id="screen-detail" class="screen">
    <div class="detail-header">
      <button class="back-btn" onclick="goHome()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="detail-header-title" id="detail-title">--</div>
    </div>

    <div class="detail-body">
      <div class="detail-section glass">
        <div class="detail-section-header">
          <span class="detail-icon">🤰</span>
          <span class="detail-section-title">ママの状態</span>
        </div>
        <p class="detail-text" id="detail-mama">--</p>
      </div>

      <div class="detail-section glass accent-mission">
        <div class="detail-section-header">
          <span class="detail-icon">🏃</span>
          <span class="detail-section-title">パパのミッション</span>
        </div>
        <p class="detail-text" id="detail-mission">--</p>
      </div>

      <div class="detail-section glass accent-proc">
        <div class="detail-section-header">
          <span class="detail-icon">📝</span>
          <span class="detail-section-title">行政手続き</span>
        </div>
        <p class="detail-text" id="detail-proc">--</p>
      </div>

      <div class="detail-section glass accent-notice">
        <div class="detail-section-header">
          <span class="detail-icon">⚠️</span>
          <span class="detail-section-title">気をつけること</span>
        </div>
        <p class="detail-text" id="detail-notice">--</p>
      </div>
    </div>

    <div class="footer-space"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
